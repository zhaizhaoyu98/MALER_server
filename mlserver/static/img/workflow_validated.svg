<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 810" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">MALER leakage-controlled analysis workflow</title>
  <desc id="workflow-desc">Development data are used for fold-local preprocessing and nested cross-validation. The fitted pipeline is evaluated once on a protected held-out test, exported as a signed MALER model, and applied to identifier-aligned external data without retraining.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#2c7fb8"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#c98900"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#2e8b57"/></marker>
    <style>
      .frame { stroke-width: 1.8; }
      .input-frame { fill: #eef7fa; stroke: #247c92; }
      .development-frame { fill: #f2f7fb; stroke: #2c7fb8; }
      .test-frame { fill: #fff8e8; stroke: #c98900; }
      .export-frame { fill: #f1f8f3; stroke: #2e8b57; }
      .external-frame { fill: #f7f9fa; stroke: #708890; }
      .inner-frame { fill: #ffffff; stroke: #8eb9d2; stroke-width: 1.4; }
      .figure-title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #1f3540; text-anchor: middle; }
      .box-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #1f3540; text-anchor: middle; }
      .side-title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #1f3540; text-anchor: middle; }
      .body { font: 16px "Segoe UI", Arial, sans-serif; fill: #415b66; text-anchor: middle; }
      .small { font: 14px "Segoe UI", Arial, sans-serif; fill: #4e6872; text-anchor: middle; }
      .tiny { font: 13px "Segoe UI", Arial, sans-serif; fill: #4e6872; text-anchor: middle; }
      .lane-label { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #607982; letter-spacing: 1.2px; }
      .chip { fill: #ffffff; stroke: #72b5c5; stroke-width: 1.2; }
      .chip-text { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #285f6d; text-anchor: middle; }
      .flow { fill: none; stroke: #2c7fb8; stroke-width: 2.8; marker-end: url(#arrow-blue); }
      .test-flow { fill: none; stroke: #c98900; stroke-width: 2.8; marker-end: url(#arrow-gold); }
      .sealed-line { fill: none; stroke: #c98900; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow-gold); }
      .join-line { fill: none; stroke: #2e8b57; stroke-width: 2.6; }
      .output-flow { fill: none; stroke: #2e8b57; stroke-width: 2.8; marker-end: url(#arrow-green); }
      .junction { fill: #2e8b57; }
    </style>
  </defs>

  <g data-box="task-selection">
    <rect data-container="true" x="35" y="22" width="570" height="102" rx="8" class="frame input-frame"/>
    <text x="320" y="55" class="figure-title">Choose an analysis task and upload data</text>
    <rect x="68" y="76" width="116" height="29" rx="14" class="chip"/><rect x="198" y="76" width="116" height="29" rx="14" class="chip"/><rect x="328" y="76" width="116" height="29" rx="14" class="chip"/><rect x="458" y="76" width="116" height="29" rx="14" class="chip"/>
    <text x="126" y="96" class="chip-text">Binary</text><text x="256" y="96" class="chip-text">Multiclass</text><text x="386" y="96" class="chip-text">Regression</text><text x="516" y="96" class="chip-text">Survival</text>
  </g>

  <path d="M320 124V136H227V150" class="flow"/><path d="M320 136H527V150" class="test-flow"/>

  <g data-box="development-data">
    <rect data-container="true" x="35" y="160" width="385" height="70" rx="8" class="frame development-frame"/>
    <text x="227.5" y="190" class="box-title">Development data</text><text x="227.5" y="215" class="body">training and model selection</text>
  </g>
  <g data-box="held-out-test">
    <rect data-container="true" x="450" y="160" width="155" height="70" rx="8" class="frame test-frame"/>
    <text x="527.5" y="189" class="side-title">Held-out test</text><text x="527.5" y="213" class="small">sealed until evaluation</text>
  </g>

  <path d="M227.5 230V260" class="flow"/>
  <g data-box="nested-validation">
    <rect data-container="true" x="35" y="270" width="385" height="165" rx="8" class="frame development-frame"/>
    <text x="227.5" y="302" class="box-title">Leakage-controlled development</text>
    <rect x="55" y="319" width="345" height="44" rx="5" class="inner-frame"/>
    <text x="227.5" y="339" class="side-title">Fold-local pipeline</text><text x="227.5" y="357" class="small">refit per fold: imputation · scaling · selection · model</text>
    <rect x="55" y="371" width="345" height="44" rx="5" class="inner-frame"/>
    <text x="227.5" y="391" class="side-title">Nested cross-validation</text><text x="227.5" y="409" class="small">inner tuning · outer performance estimation</text>
  </g>

  <path d="M527.5 230V247H618V445H527.5V455" class="sealed-line"/>
  <text x="526" y="292" class="small">No preprocessing</text><text x="526" y="318" class="small">No feature selection</text><text x="526" y="344" class="small">No model tuning</text>

  <path d="M227.5 435V455" class="flow"/>
  <g data-box="final-fit">
    <rect data-container="true" x="35" y="465" width="385" height="80" rx="8" class="frame input-frame"/>
    <text x="227.5" y="496" class="box-title">Lock and fit the selected pipeline</text><text x="227.5" y="522" class="body">development data only</text>
  </g>
  <path d="M420 505H440" class="test-flow"/>
  <g data-box="held-out-evaluation">
    <rect data-container="true" x="450" y="465" width="155" height="80" rx="8" class="frame test-frame"/>
    <text x="527.5" y="493" class="side-title">Evaluate once</text><text x="527.5" y="517" class="small">after all choices</text><text x="527.5" y="536" class="small">are locked</text>
  </g>

  <path d="M227.5 545V575" class="flow"/>
  <g data-box="model-export">
    <rect data-container="true" x="35" y="585" width="385" height="78" rx="8" class="frame export-frame"/>
    <text x="227.5" y="615" class="box-title">Export signed .maler model</text><text x="227.5" y="641" class="body">fitted pipeline and expected feature identifiers</text>
  </g>
  <g data-box="external-data">
    <rect data-container="true" x="450" y="585" width="155" height="78" rx="8" class="frame external-frame"/>
    <text x="527.5" y="613" class="side-title">External data</text><text x="527.5" y="635" class="tiny">identifier-aligned</text><text x="527.5" y="654" class="tiny">features</text>
  </g>

  <path d="M227.5 663V694H320" class="join-line"/><path d="M527.5 663V694H320" class="join-line"/>
  <circle cx="320" cy="694" r="4" class="junction"/><path d="M320 698V717" class="output-flow"/>
  <g data-box="external-prediction">
    <rect data-container="true" x="95" y="727" width="450" height="60" rx="8" class="frame export-frame"/>
    <text x="320" y="754" class="box-title">External prediction without retraining</text><text x="320" y="777" class="small">predicted outcomes or risk scores</text>
  </g>
</svg>
